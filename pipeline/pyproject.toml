[project]
name = "off-book-pipeline"
version = "0.0.0"
description = "Offline pipeline for Off Book: builds the position pool and the rating calibration."
license = "AGPL-3.0-or-later"
requires-python = ">=3.13"
dependencies = [
    "chess>=1.11.2",
]
classifiers = ["Private :: Do Not Upload"]

[build-system]
requires = ["uv_build>=0.11,<0.14"]
build-backend = "uv_build"

# Every dependency, including these, is listed with its licence in THIRD_PARTY_LICENCES.md.
[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest]
testpaths = ["tests"]
strict = true
addopts = ["-ra"]
