# Lint, type-check and test every push to main, plus pull requests (P0-02).
# Actions are pinned to commit SHAs, as Lichess does; the comment gives the release.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pull request runs are cancelled; every push to main is built to the end.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Check formatting
        run: pnpm check-format
      - name: Type-check
        run: pnpm typecheck
      - name: Test
        run: pnpm test

  pipeline:
    name: Pipeline (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          working-directory: pipeline
          enable-cache: true
          cache-dependency-glob: uv.lock # relative to working-directory
      - run: uv sync --locked
      - name: Lint
        run: uv run --locked ruff check
      - name: Check formatting
        run: uv run --locked ruff format --check
      - name: Type-check
        run: uv run --locked mypy
      # P1-01: the engine check runs against a real Stockfish 19 as well as a fake. Built from source rather
      # than downloaded, which also shows that a build other than the official binaries passes.
      - name: Restore Stockfish 19
        id: stockfish
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/stockfish
          key: stockfish-sf_19-x86-64-avx2
      - name: Build Stockfish 19
        if: steps.stockfish.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          git clone --quiet --depth 1 --branch sf_19 https://github.com/official-stockfish/Stockfish.git source
          make -C source/src -j"$(nproc)" build ARCH=x86-64-avx2 >/dev/null
          mkdir -p stockfish && cp source/src/stockfish stockfish/
      - name: Test
        run: uv run --locked pytest
        env:
          OFF_BOOK_STOCKFISH: ${{ runner.temp }}/stockfish/stockfish

  licences:
    name: Licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          working-directory: pipeline
          enable-cache: true
          cache-dependency-glob: uv.lock # relative to working-directory
      - run: pnpm install --frozen-lockfile
      - run: uv sync --locked --directory pipeline
      - name: Check licences
        run: pnpm check-licences

  stack:
    # Local stack (P0-03) and migrations (P0-04): the same compose file, started from nothing, reached
    # through .env.example's URL, then migrated and checked by db/check.sh.
    # Linux only: GitHub's Windows runners cannot run Linux containers.
    name: Local stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start the stack
        run: docker compose up --wait
      - name: Connect with the documented DATABASE_URL
        run: |
          set -a; . ./.env.example; set +a
          version=$(psql "$DATABASE_URL" --no-psqlrc --tuples-only --no-align --command 'show server_version_num')
          echo "Connected to PostgreSQL $version"
          test "$version" -ge 180000 && test "$version" -lt 190000
      - name: Reset wipes the database
        run: |
          set -a; . ./.env.example; set +a
          psql "$DATABASE_URL" --no-psqlrc --quiet --command 'create table reset_probe ()'
          docker compose down --volumes && docker compose up --wait
          count=$(psql "$DATABASE_URL" --no-psqlrc --tuples-only --no-align \
            --command "select count(*) from pg_tables where tablename = 'reset_probe'")
          test "$count" -eq 0
      - name: Migrate the empty database
        run: docker compose run --rm migrate
      - name: Check the schema
        run: bash db/check.sh
      - name: Show the database log on failure
        if: failure()
        run: docker compose logs db
