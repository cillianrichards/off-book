# Lint, type-check and test every push to main, plus pull requests (P0-02). The TypeScript and licence
# jobs also run on Windows, where development happens (P0-05).
# Actions are pinned to commit SHAs, as Lichess does; the comment gives the release.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pull request runs are cancelled; every push to main is built to the end.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # A Windows failure must not hide the Linux result, or the reverse.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Check formatting
        run: pnpm check-format
      - name: Type-check
        run: pnpm typecheck
      - name: Test
        run: pnpm test

  pipeline:
    name: Pipeline (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          working-directory: pipeline
          enable-cache: true
          cache-dependency-glob: uv.lock # relative to working-directory
      - run: uv sync --locked
      - name: Lint
        run: uv run --locked ruff check
      - name: Check formatting
        run: uv run --locked ruff format --check
      - name: Type-check
        run: uv run --locked mypy
      # P1-01: the engine check runs against a real Stockfish 19 as well as a fake. Built from source rather
      # than downloaded, which also shows that a build other than the official binaries passes.
      - name: Restore Stockfish 19
        id: stockfish
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/stockfish
          key: stockfish-sf_19-x86-64-avx2
      - name: Build Stockfish 19
        if: steps.stockfish.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          git clone --quiet --depth 1 --branch sf_19 https://github.com/official-stockfish/Stockfish.git source
          make -C source/src -j"$(nproc)" build ARCH=x86-64-avx2 >/dev/null
          mkdir -p stockfish && cp source/src/stockfish stockfish/
      - name: Test
        run: uv run --locked pytest
        env:
          OFF_BOOK_STOCKFISH: ${{ runner.temp }}/stockfish/stockfish

  licences:
    name: Licences (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          working-directory: pipeline
          enable-cache: true
          cache-dependency-glob: uv.lock # relative to working-directory
      - run: pnpm install --frozen-lockfile
      - run: uv sync --locked --directory pipeline
      - name: Check licences
        run: pnpm check-licences

  stack:
    # Local stack (P0-03) and migrations (P0-04): the same compose file, started from nothing, reached
    # through .env.example's URL, then migrated and checked by db/check.sh.
    # Linux only: GitHub's Windows runners cannot run Linux containers.
    name: Local stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start the stack
        run: docker compose up --wait
      - name: Connect with the documented DATABASE_URL
        run: |
          set -a; . ./.env.example; set +a
          version=$(psql "$DATABASE_URL" --no-psqlrc --tuples-only --no-align --command 'show server_version_num')
          echo "Connected to PostgreSQL $version"
          test "$version" -ge 180000 && test "$version" -lt 190000
      - name: Reset wipes the database
        run: |
          set -a; . ./.env.example; set +a
          psql "$DATABASE_URL" --no-psqlrc --quiet --command 'create table reset_probe ()'
          docker compose down --volumes && docker compose up --wait
          count=$(psql "$DATABASE_URL" --no-psqlrc --tuples-only --no-align \
            --command "select count(*) from pg_tables where tablename = 'reset_probe'")
          test "$count" -eq 0
      - name: Migrate the empty database
        run: docker compose run --rm migrate
      - name: Check the schema
        run: bash db/check.sh
      # The server's PostgreSQL tests (P2-08, P2-12), against the migrated stack.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test the server against PostgreSQL
        run: |
          set -a; . ./.env.example; set +a
          OFF_BOOK_TEST_DATABASE_URL="$DATABASE_URL" pnpm --filter @off-book/server test:postgres
      - name: Show the database log on failure
        if: failure()
        run: docker compose logs db

  images:
    # The deployable images (P2-01), built and run as staging runs them: migrations applied by the
    # migration image, then the app image serving the API and the client bundle against that database,
    # and stopping cleanly on SIGTERM.
    name: Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the app image
        run: docker build --tag off-book:ci .
      - name: Build the migration image
        run: docker build --tag off-book-migrate:ci --file db/Dockerfile .
      - name: Start PostgreSQL
        run: docker compose up --wait db
      - name: Migrate with the migration image
        run: |
          docker run --rm --network host \
            --env DATABASE_URL='postgres://off_book:off_book@127.0.0.1:5432/off_book?sslmode=disable' \
            off-book-migrate:ci
      - name: Run the app image
        run: |
          docker run --detach --name app --network host \
            --env DATABASE_URL='postgres://off_book:off_book@127.0.0.1:5432/off_book' off-book:ci
          curl --silent --show-error --fail --retry 20 --retry-delay 1 --retry-all-errors http://127.0.0.1:8080/health
      - name: Check it serves the API and the client
        run: |
          curl --silent --show-error --fail http://127.0.0.1:8080/ | grep --quiet 'rel="manifest"'
          curl --silent --show-error --fail http://127.0.0.1:8080/abcd1234 | grep --quiet 'id="root"'
          curl --silent --show-error --fail http://127.0.0.1:8080/manifest.webmanifest | grep --quiet '"Off Book"'
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/api/games/abcd1234)
          test "$status" = 404
      - name: Stop it cleanly
        run: |
          docker stop --time 30 app
          test "$(docker inspect --format '{{.State.ExitCode}}' app)" = 0
          docker logs app 2>&1 | grep --quiet '"stopped"'
      - name: Show the app's log on failure
        if: failure()
        run: docker logs app || true

  infra:
    # The Azure templates (P2-01) compile and pass Bicep's linter, so a broken template fails here, not at
    # deploy time. The param file reads its images and password from the environment, faked here.
    name: Infrastructure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: az bicep install
      - name: Compile and lint the template
        run: |
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep lint --file infra/main.bicep
      - name: Compile the staging parameters
        env:
          MIGRATE_IMAGE: ghcr.io/example/off-book-migrate:ci
          POSTGRES_ADMIN_PASSWORD: not-a-real-password
        run: az bicep build-params --file infra/staging.bicepparam --stdout > /dev/null
