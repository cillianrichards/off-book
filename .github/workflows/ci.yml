# Lint, type-check and test every push to main, plus pull requests (P0-02).
# Actions are pinned to commit SHAs, as Lichess does; the comment gives the release.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pull request runs are cancelled; every push to main is built to the end.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Check formatting
        run: pnpm check-format
      - name: Type-check
        run: pnpm typecheck
      - name: Test
        run: pnpm test

  pipeline:
    name: Pipeline (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          working-directory: pipeline
          enable-cache: true
          cache-dependency-glob: uv.lock # relative to working-directory
      - run: uv sync --locked
      - name: Lint
        run: uv run --locked ruff check
      - name: Check formatting
        run: uv run --locked ruff format --check
      - name: Type-check
        run: uv run --locked mypy
      - name: Test
        run: uv run --locked pytest

  licences:
    name: Licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          working-directory: pipeline
          enable-cache: true
          cache-dependency-glob: uv.lock # relative to working-directory
      - run: pnpm install --frozen-lockfile
      - run: uv sync --locked --directory pipeline
      - name: Check licences
        run: pnpm check-licences

  stack:
    # Local stack (P0-03): the same compose file, started from nothing, reached through .env.example's URL.
    # Linux only: GitHub's Windows runners cannot run Linux containers.
    name: Local stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start the stack
        run: docker compose up --wait
      - name: Connect with the documented DATABASE_URL
        run: |
          set -a; . ./.env.example; set +a
          version=$(psql "$DATABASE_URL" --no-psqlrc --tuples-only --no-align --command 'show server_version_num')
          echo "Connected to PostgreSQL $version"
          test "$version" -ge 180000 && test "$version" -lt 190000
      - name: Reset wipes the database
        run: |
          set -a; . ./.env.example; set +a
          psql "$DATABASE_URL" --no-psqlrc --quiet --command 'create table reset_probe ()'
          docker compose down --volumes && docker compose up --wait
          count=$(psql "$DATABASE_URL" --no-psqlrc --tuples-only --no-align \
            --command "select count(*) from pg_tables where tablename = 'reset_probe'")
          test "$count" -eq 0
      - name: Show the database log on failure
        if: failure()
        run: docker compose logs db
